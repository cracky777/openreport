# OpenReport as a single container, plain HTTP on port 3001.
#
# For a home server, a NAS, a Raspberry Pi, or a host where a reverse proxy
# you already run (Caddy, Traefik, Nginx Proxy Manager…) terminates TLS.
# docker-compose.yml is the other option: the full stack with its own nginx and
# Let's Encrypt certificate, for a public host with a domain name.
#
#   printf 'SESSION_SECRET=%s\nINTERNAL_TOKEN_SECRET=%s\nDATASOURCE_ENC_KEY=%s\n' \
#     $(openssl rand -hex 32) $(openssl rand -hex 32) $(openssl rand -hex 32) > .env
#   docker compose -f docker-compose.simple.yml up -d
#
# Then open http://<host>:3001 — the first account to sign up becomes the admin.
#
# Behind a reverse proxy, forward X-Forwarded-Proto: the session cookie gets its
# Secure flag from that header, so the same image serves http://nas:3001 on the
# LAN and https://reports.example.com through the proxy. All three secrets are
# mandatory; the server refuses to start with a missing or sample value.
# DATASOURCE_ENC_KEY encrypts your database passwords at rest — back it up with
# the volume, the credentials are unreadable without it.
services:
  openreport:
    image: ghcr.io/cracky777/openreport:latest
    # To run your own checkout instead of the published image, replace the
    # line above with:  build: .
    container_name: openreport
    restart: unless-stopped
    ports:
      - "${OPENREPORT_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - "SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET required (generate: openssl rand -hex 32)}"
      - "INTERNAL_TOKEN_SECRET=${INTERNAL_TOKEN_SECRET:?INTERNAL_TOKEN_SECRET required (openssl rand -hex 32; must differ from SESSION_SECRET)}"
      - "DATASOURCE_ENC_KEY=${DATASOURCE_ENC_KEY:?DATASOURCE_ENC_KEY required (openssl rand -hex 32; keep it stable / backed up)}"
      # Optional. See .env.example for what each one does.
      - "CORS_ORIGIN=${CORS_ORIGIN:-}"
      - "EMBED_FRAME_ANCESTORS=${EMBED_FRAME_ANCESTORS:-}"
      - "EMBED_TOKEN_SECRET=${EMBED_TOKEN_SECRET:-}"
      - "OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}"
      - "OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}"
      - "OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}"
      - "OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}"
      - "OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-}"
      - "OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE:-}"
      - "OIDC_AUTO_PROVISION=${OIDC_AUTO_PROVISION:-}"
      - "OIDC_ALLOW_EMAIL_LINKING=${OIDC_ALLOW_EMAIL_LINKING:-}"
    volumes:
      # SQLite metadata, uploaded files, rollup caches. Everything to back up.
      - openreport-data:/app/server/data

volumes:
  openreport-data:
