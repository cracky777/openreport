services:
  app:
    build: .
    container_name: openreport
    restart: unless-stopped
    # No host port mapping — the app is reachable only through nginx (internal
    # docker network → http://app:3001). Access prod via nginx on :80/:443.
    environment:
      - NODE_ENV=production
      - PORT=3001
      - "SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET required (generate: openssl rand -hex 32)}"
      - "INTERNAL_TOKEN_SECRET=${INTERNAL_TOKEN_SECRET:?INTERNAL_TOKEN_SECRET required (openssl rand -hex 32; must differ from SESSION_SECRET)}"
      - "DATASOURCE_ENC_KEY=${DATASOURCE_ENC_KEY:?DATASOURCE_ENC_KEY required (openssl rand -hex 32; keep it stable / backed up)}"
      # Sites allowed to frame an /embed page (CSP frame-ancestors).
      # Default * — narrow it to your customers' domains when you know them.
      - "EMBED_FRAME_ANCESTORS=${EMBED_FRAME_ANCESTORS:-}"
      # Embed tokens — optional dedicated secret; falls back to
      # INTERNAL_TOKEN_SECRET. See server/utils/embedToken.js.
      - "EMBED_TOKEN_SECRET=${EMBED_TOKEN_SECRET:-}"
      # OIDC single sign-on — all optional; SSO stays off until the first
      # three are set. See server/utils/oidc.js for the full contract.
      - "OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}"
      - "OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}"
      - "OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}"
      - "OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}"
      - "OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-}"
      - "OIDC_DEFAULT_ROLE=${OIDC_DEFAULT_ROLE:-}"
      - "OIDC_AUTO_PROVISION=${OIDC_AUTO_PROVISION:-}"
      # Set to 1 only for an IdP you trust that omits email_verified: it lets a
      # first SSO login attach to an existing password account by email alone.
      - "OIDC_ALLOW_EMAIL_LINKING=${OIDC_ALLOW_EMAIL_LINKING:-}"
    volumes:
      - app-data:/app/server/data
    networks:
      - openreport-net

  nginx:
    image: nginx:alpine
    container_name: openreport-nginx
    # nginx reads its certificates once, at start. A renewed certificate is
    # therefore invisible to a running container — the site keeps serving the
    # expired one. Reload every 6 h alongside the server itself; a reload is
    # graceful (existing connections finish on the old workers).
    command: /bin/sh -c 'while :; do sleep 6h & wait; nginx -s reload; done & nginx -g "daemon off;"'
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - app
    networks:
      - openreport-net

  certbot:
    image: certbot/certbot
    container_name: openreport-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - nginx
    # Issuance is a one-shot, run by hand for each new name. Renewal is the
    # certbot-renew service below — deliberately a SEPARATE service so this one
    # keeps the image's `certbot` entrypoint and the command below still works:
    #   docker compose run --rm certbot certonly --webroot -w /var/lib/letsencrypt -d yourdomain.com

  # Let's Encrypt certificates last 90 days. Nothing here renewed them: certbot
  # in a container has neither the systemd timer nor the cron job it installs on
  # a host, so the certificate simply expired and HTTPS broke. This loop asks
  # twice a day; certbot itself no-ops until a certificate is within 30 days of
  # expiry, so it is cheap and never hammers the ACME service.
  certbot-renew:
    image: certbot/certbot
    container_name: openreport-certbot-renew
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/lib/letsencrypt --quiet; sleep 12h & wait; done'
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - nginx

volumes:
  app-data:
  certbot-etc:
  certbot-var:

networks:
  openreport-net:
