name: Docker image

# Publishes ghcr.io/<owner>/openreport. A release tag (v1.2.3) produces the
# `1.2.3`, `1.2` and `latest` tags; every push to master refreshes `edge`.
# docker-compose.simple.yml and the README point at `latest`, so the image a
# reader pulls is always the last release, never a half-tested master.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arm64 is not optional for a self-hosted tool: Raspberry Pi and Apple
      # Silicon are the two machines people try it on first. The native modules
      # (better-sqlite3, duckdb) ship linux-arm64 prebuilt binaries, so the
      # emulated stage only downloads — it never compiles.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
